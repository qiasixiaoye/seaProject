name: ocean-rag-agent

services:
  backend:
    image: ocean-rag-agent/backend:latest
    build:
      context: ..
      dockerfile: docker_deploy/backend/Dockerfile
    container_name: ocean-deploy-backend
    environment:
      OCEAN_DATA_DIR: /app/data
      OCEAN_INSTANCE_DIR: /app/instance
      GEOSERVER_PUBLIC_URL: /geoserver
      GEOSERVER_INTERNAL_URL: http://geoserver:8080/geoserver
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://ragflow-cpu:9380}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      RAGFLOW_DATASET_IDS: ${RAGFLOW_DATASET_IDS:-}
      OCEAN_EMBEDDING_BACKEND: ${OCEAN_EMBEDDING_BACKEND:-hash}
      OCEAN_EMBEDDING_MODEL: ${OCEAN_EMBEDDING_MODEL:-local-hash-ngram-v1}
      OCEAN_EMBEDDING_WEIGHT: ${OCEAN_EMBEDDING_WEIGHT:-0.42}
    volumes:
      - ../backend:/app/backend:ro
      - ../geo_agent:/app/geo_agent:ro
      - ../ocean_agents_demo:/app/ocean_agents_demo:ro
      - ../data:/app/data
      - ../instance:/app/instance
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  geo-api:
    image: ocean-rag-agent/geo-api:latest
    build:
      context: ..
      dockerfile: docker_deploy/geo-api/Dockerfile
    container_name: ocean-deploy-geo-api
    command: ["python", "/app/geo_api.py", "--port", "5001"]
    environment:
      OCEAN_DATA_DIR: /app/data
      PORT: "5001"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://ragflow-cpu:9380}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      RAGFLOW_DATASET_IDS: ${RAGFLOW_DATASET_IDS:-}
    volumes:
      - ../geo_api.py:/app/geo_api.py:ro
      - ../geo_agent:/app/geo_agent:ro
      - ../ocean_agents_demo:/app/ocean_agents_demo:ro
      - ../data:/app/data
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${GEO_API_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: ocean-deploy-nginx
    depends_on:
      backend:
        condition: service_healthy
      geo-api:
        condition: service_healthy
      geoserver:
        condition: service_started
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  geoserver:
    image: docker.osgeo.org/geoserver:3.0.x
    container_name: ocean-deploy-geoserver
    environment:
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: netcdf
    ports:
      - "${GEOSERVER_PORT:-8081}:8080"
    volumes:
      - ../geoserver_data:/opt/geoserver_data
      - ../data/geoserver_upload:/opt/geoserver_data/import
    restart: unless-stopped

  mcp-server:
    profiles: ["mcp"]
    image: ocean-rag-agent/mcp-server:latest
    build:
      context: ..
      dockerfile: docker_deploy/mcp-server/Dockerfile
    container_name: ocean-deploy-mcp-server
    command: ["python", "/app/mcp_server.py"]
    environment:
      OCEAN_DATA_DIR: /app/data
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://ragflow-cpu:9380}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      RAGFLOW_DATASET_IDS: ${RAGFLOW_DATASET_IDS:-}
    volumes:
      - ../mcp_server.py:/app/mcp_server.py:ro
      - ../geo_agent:/app/geo_agent:ro
      - ../ocean_agents_demo:/app/ocean_agents_demo:ro
      - ../data:/app/data
    stdin_open: true
    tty: false
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: "no"

  es01:
    profiles: ["ragflow"]
    image: elasticsearch:${STACK_VERSION:-8.11.3}
    container_name: ocean-deploy-ragflow-es01
    environment:
      node.name: es01
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      bootstrap.memory_lock: "false"
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "${ES_PORT:-11200}:9200"
    volumes:
      - ./ragflow/data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  mysql:
    profiles: ["ragflow"]
    image: mysql:8.0.39
    container_name: ocean-deploy-ragflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
      MYSQL_DATABASE: ${MYSQL_DBNAME:-rag_flow}
    command: --max_connections=1000 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password --tls_version=TLSv1.2,TLSv1.3 --binlog_expire_logs_seconds=604800
    ports:
      - "${EXPOSE_MYSQL_PORT:-13306}:3306"
    volumes:
      - ./ragflow/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_PASSWORD:-infini_rag_flow}"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  minio:
    profiles: ["ragflow"]
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    container_name: ocean-deploy-ragflow-minio
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-rag_flow}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
    ports:
      - "${MINIO_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - ./ragflow/data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  redis:
    profiles: ["ragflow"]
    image: valkey/valkey:8
    container_name: ocean-deploy-ragflow-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-infini_rag_flow}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - ./ragflow/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-infini_rag_flow}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  ragflow-cpu:
    profiles: ["ragflow"]
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.25.3}
    container_name: ocean-deploy-ragflow-cpu
    command: ["--enable-adminserver"]
    environment:
      DOC_ENGINE: ${DOC_ENGINE:-elasticsearch}
      DEVICE: ${DEVICE:-cpu}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      ES_HOST: es01
      ES_PORT: "9200"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
      MYSQL_HOST: mysql
      MYSQL_DBNAME: ${MYSQL_DBNAME:-rag_flow}
      MYSQL_PORT: "3306"
      MYSQL_MAX_PACKET: ${MYSQL_MAX_PACKET:-1073741824}
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MINIO_USER: ${MINIO_USER:-rag_flow}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-infini_rag_flow}
      TZ: ${TZ:-Asia/Shanghai}
      REGISTER_ENABLED: ${REGISTER_ENABLED:-1}
      API_PROXY_SCHEME: ${API_PROXY_SCHEME:-python}
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: ${DOTNET_SYSTEM_GLOBALIZATION_INVARIANT:-1}
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SVR_WEB_HTTP_PORT:-8088}:80"
      - "${SVR_WEB_HTTPS_PORT:-8443}:443"
      - "${SVR_HTTP_PORT:-9380}:9380"
      - "${ADMIN_SVR_HTTP_PORT:-9381}:9381"
      - "${SVR_MCP_PORT:-9382}:9382"
      - "${GO_HTTP_PORT:-9384}:9384"
      - "${GO_ADMIN_PORT:-9383}:9383"
    volumes:
      - ./ragflow/logs:/ragflow/logs
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
